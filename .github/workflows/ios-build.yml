# GitHub Actions: build the pelegram (Telegram-iOS fork) IPA on a macOS runner.
#
# Place this at `.github/workflows/ios-build.yml` IN THE FORK (not in D:\pelegram).
# Produces an UNSIGNED IPA artifact; the Hetzner box re-signs it with your free
# Apple ID (see Integration/hetzner_headless_signer.md).
#
# NOTE: Telegram-iOS builds through `build-system/` (Bazel wrapped by Make.py).
# Exact flags change between versions — verify against your fork's
# `build-system/Make/Make.py --help` and `Makefile`. The steps below are the
# standard shape; the TODOs are the parts you confirm once.

name: ios-build

on:
  workflow_dispatch: {}          # manual trigger; also runs on demand from CLI
  push:
    branches: [ hidden-area ]     # your feature branch

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # versions.json pins xcode 26.2 / macos 26. Use the newest runner available.
    runs-on: macos-latest
    timeout-minutes: 350         # Telegram-iOS Bazel build is heavy

    steps:
      - name: Checkout fork (monorepo, no external submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode (match versions.json -> xcode 26.2, fallback to latest)
        run: |
          WANT=$(python3 -c "import json;print(json.load(open('versions.json'))['xcode'])" 2>/dev/null || echo 26.2)
          APP=$(ls -d "/Applications/Xcode_${WANT}.app" 2>/dev/null \
            || ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 \
            || echo /Applications/Xcode.app)
          echo "Using $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version

      - name: Install toolchain deps
        run: |
          # Telegram-iOS needs a specific Bazel + rust; their scripts pin versions.
          # Most forks vendor this in build-system/. If not:
          brew install bazelisk || true
          rustup toolchain install stable || true

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('**/WORKSPACE', '**/*.bzl') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build IPA with FAKE codesigning (unsigned, main app only)
        env:
          # Telegram-iOS ships example/fake codesigning for CI in
          # build-system/fake-codesigning — this yields an installable-shape .app
          # that AltServer will strip & re-sign.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # TODO verify exact invocation for your fork. Typical form:
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/.cache/bazel" \
            build \
            --configurationPath=build-system/fake-codesigning/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="$BUILD_NUMBER" \
            --configuration=release_universal
          # See hetzner doc / FEATURES: strip extensions so the free-signing
          # 3-app limit is respected. If the fork still emits extensions, delete
          # them from the Payload before zipping (next step).

      - name: Locate and normalize IPA
        id: ipa
        run: |
          set -e
          # Find the produced .ipa (path varies: bazel-bin/... or build/artifacts/...).
          IPA=$(find . -name "*.ipa" -type f | head -n1)
          if [ -z "$IPA" ]; then
            # Fallback: package the .app into an IPA (Payload/<App>.app -> zip).
            APP=$(find . -name "Telegram.app" -type d | head -n1)
            mkdir -p Payload
            cp -R "$APP" Payload/
            # Strip app extensions to fit free-provisioning 3-app limit:
            rm -rf Payload/*.app/PlugIns Payload/*.app/Watch || true
            /usr/bin/zip -qry pelegram-unsigned.ipa Payload
            IPA=pelegram-unsigned.ipa
          fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelegram-unsigned-ipa
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 7

      # OPTIONAL: push the IPA straight to the Hetzner signer instead of storing
      # it as an artifact (keeps it off GitHub). Requires a self-hosted secret.
      # - name: Ship to Hetzner signer
      #   run: |
      #     scp -i <key> "${{ steps.ipa.outputs.path }}" \
      #       signer@<hetzner-host>:/opt/pelegram/incoming/pelegram-unsigned.ipa
